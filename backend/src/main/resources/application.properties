spring.config.import=optional:file:../../.env.local,optional:file:.env.local

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/tender-ai-db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true

spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

server.port=${PORT:${SERVER_PORT:8081}}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=52MB

app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.jwt.secret=${JWT_SECRET:nex tender ai local development jwt secret key 2026 change me now}

ai.provider=${AI_PROVIDER:${SPRING_AI_MODEL_CHAT:openai}}
ai.timeout-seconds=${AI_TIMEOUT_SECONDS:30}
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}

spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:${AI_PROVIDER:none}}
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.chat.client.enabled=true

spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.chat.options.responseFormat.type=JSON_OBJECT

spring.ai.vertex.ai.gemini.project-id=${GEMINI_PROJECT_ID:${GOOGLE_CLOUD_PROJECT:}}
spring.ai.vertex.ai.gemini.location=${GEMINI_LOCATION:us-central1}
spring.ai.vertex.ai.gemini.credentials-uri=${GEMINI_CREDENTIALS_URI:}
spring.ai.vertex.ai.gemini.transport=${GEMINI_TRANSPORT:REST}
spring.ai.vertex.ai.gemini.chat.options.model=${GEMINI_MODEL:gemini-2.0-flash}
spring.ai.vertex.ai.gemini.chat.options.temperature=0.2
spring.ai.vertex.ai.gemini.chat.options.response-mime-type=application/json
