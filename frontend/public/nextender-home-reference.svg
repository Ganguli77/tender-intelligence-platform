<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">NexTender AI landing page visual reference</title>
  <desc id="desc">Dark blue AI tender intelligence landing page with a glowing global network sphere.</desc>
  <defs>
    <radialGradient id="bg" cx="72%" cy="44%" r="78%"><stop offset="0" stop-color="#102c56"/><stop offset=".42" stop-color="#07162f"/><stop offset="1" stop-color="#020817"/></radialGradient>
    <radialGradient id="globe" cx="36%" cy="27%" r="72%"><stop offset="0" stop-color="#66f7ff" stop-opacity=".94"/><stop offset=".22" stop-color="#1c7ee8" stop-opacity=".52"/><stop offset=".64" stop-color="#122864" stop-opacity=".88"/><stop offset="1" stop-color="#050b21"/></radialGradient>
    <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#63f7ff"/><stop offset="1" stop-color="#4383ff"/></linearGradient>
    <linearGradient id="pink" x1="0" x2="1"><stop stop-color="#ff56ca"/><stop offset="1" stop-color="#884dff"/></linearGradient>
