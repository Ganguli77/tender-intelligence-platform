  <desc id="desc">A dark NexTender AI landing page with a shaded realistic blue planet, subtle continents, atmospheric cyan rim, and restrained tender network routes.</desc>
  <defs>
    <radialGradient id="space" cx="68%" cy="46%" r="80%"><stop offset="0" stop-color="#122d56"/><stop offset=".48" stop-color="#06152e"/><stop offset="1" stop-color="#020711"/></radialGradient>
    <radialGradient id="planet" cx="30%" cy="25%" r="78%"><stop offset="0" stop-color="#4b9ec8"/><stop offset=".18" stop-color="#1c638f"/><stop offset=".48" stop-color="#0a315a"/><stop offset=".78" stop-color="#04162f"/><stop offset="1" stop-color="#010817"/></radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a2fbff"/><stop offset=".42" stop-color="#22c7ec"/><stop offset=".8" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
